version: '3.8'

services:
  # PostgreSQL Database (using existing container)
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-testanalytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - test-analytics-network

  # Ollama AI Service (using existing container)
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - test-analytics-network

  # Test Analytics Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-analytics-app
    environment:
      # Database
      DB_HOST: postgres-db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-testanalytics}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # Application
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - test-analytics-network

volumes:
  postgres_data:
    driver: local
  ollama:
    driver: local

networks:
  test-analytics-network:
    driver: bridge

